server:
  port: 9001

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5438}/wcs
    username: ${DB_USERNAME:wcs}
    password: ${DB_PASSWORD:devPostgreSQL}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

wcs:
  shuttle:
    base-url: ${SHUTTLE_WCS_BASE_URL:http://localhost:9002}
  rabbitmq:
    exchange: wcs.topic
    queue:
      inbound-cmd: wcs.queue.inbound.cmd
      inbound-cancel: wcs.queue.inbound.cancel
    routing-key:
      inbound-cmd: wms.inbound.cmd
      inbound-complete: wcs.inbound.complete
      inbound-cancel: wms.inbound.cancel

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.wcsapp: DEBUG
