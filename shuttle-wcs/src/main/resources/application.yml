server:
  port: 9002

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5438}/wcs?currentSchema=biz
    username: ${DB_USERNAME:wcs}
    password: ${DB_PASSWORD:devPostgreSQL}
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

wcs:
  rcs:
    base-url: ${RCS_MOCK_BASE_URL:http://localhost:9003}

logging:
  level:
    com.example.shuttlewcs: DEBUG
